exclude: '^aas'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args:
          - "--unsafe"
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.13.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: copyedit
        name: Apply journal copy-edit rules
        description: Rewrites .tex files according to .copyedit-rules.yaml.
        entry: uv run python bin/copyedit.py
        language: system
        files: '\.tex$'
        exclude: '^(lsst-texmf/|aglossary\.tex$|tests/data/|RTN-115\.tex$)'
